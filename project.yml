name: IslandSpeed
options:
  deploymentTarget:
    iOS: '16.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1.3'
    CURRENT_PROJECT_VERSION: '7'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  IslandSpeed:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [quiet.wav, silence.wav]
      - Shared
    dependencies:
      - target: IslandSpeedWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 灵动网速
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: '用于用户主动开启的后台网速监控实验。不保存或上传位置。'
        NSLocationAlwaysAndWhenInUseUsageDescription: '监控开启期间尝试利用后台定位更新保持网速采样，不保存或上传位置；停止监控即停止定位。'
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandspeed.local
  IslandSpeedWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 灵动网速
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandspeed.local.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  IslandSpeed:
    build:
      targets:
        IslandSpeed: all
